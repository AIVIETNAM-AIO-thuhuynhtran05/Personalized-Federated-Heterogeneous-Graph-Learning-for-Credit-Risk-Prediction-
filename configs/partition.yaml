# Kịch bản đang dùng (ghi đè bằng --scenario khi chạy script 02-05)
scenario: region_territory_a0.5

scenarios:
  # KỊCH BẢN CHÍNH. Mỗi vùng (REGION_POPULATION_RELATIVE: 81 giá trị, mỗi giá trị ứng với đúng
  # một REGION_RATING_CLIENT) do đúng 1 tổ chức phụ trách; quy mô tổ chức q ~ Dirichlet(alpha).
  # Khách hàng thuộc tổ chức phụ trách vùng nơi họ sinh sống.
  region_territory_a0.5:
    method: region_territory
    region_col: REGION_POPULATION_RELATIVE
    num_clients: 5
    alpha: 0.5
    seed: 42

  # Cơ cấu danh mục: mọi tổ chức phục vụ mọi phân khúc thu nhập nhưng có thế mạnh riêng.
  # Với mỗi phân khúc: tỷ lệ giao cho các tổ chức = (1 - floor) * Dirichlet(alpha) + floor / K
  income_mix_a0.5:
    method: segment_mix
    segment_col: NAME_INCOME_TYPE
    # Gộp 4 nhóm rất nhỏ (55 khách hàng) vào nhóm gần nhất
    segment_map:
      Working: Working
      Commercial associate: Commercial
      Businessman: Commercial
      Pensioner: Pensioner
      Unemployed: Pensioner
      Maternity leave: Pensioner
      Student: Pensioner
      State servant: State servant
    num_clients: 5
    alpha: 0.5
    floor: 0.1
    seed: 42

  # STRESS TEST (phi thực tế): Dirichlet trên nhãn TARGET -> lệch nhãn cực đoan
  label_dirichlet_a0.5:
    method: dirichlet_label
    num_clients: 5
    alpha: 0.5
    seed: 42

constraints:
  # Client nhỏ nhất phải chiếm ít nhất ngần này tỷ lệ khách hàng
  min_client_share: 0.03
  # Mỗi client cần đủ mẫu mỗi lớp ở Train/Val/Test để train, chọn threshold và đánh giá
  min_samples_per_class_per_split: 30
  max_tries: 1000
