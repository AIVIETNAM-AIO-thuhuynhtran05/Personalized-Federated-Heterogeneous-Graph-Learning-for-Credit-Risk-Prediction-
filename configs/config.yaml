seed: 42

paths:
  raw_dir: data/raw/home-credit-default-risk
  processed_dir: data/processed
  results_dir: results

# Chỉ application_train có TARGET -> mọi tập có nhãn đều tách từ đây.
# Split được tạo MỘT LẦN và dùng chung cho cả nhánh Centralized lẫn Federated
# (bước partition client phải giữ nguyên cột `split`).
split:
  val_size: 0.15
  test_size: 0.15
  stratify: TARGET

files:
  features: application_features.parquet
  splits: splits.parquet

threshold:
  # Tiêu chí chọn threshold trên Validation: f1 | youden
  criterion: f1
