logistic_regression:
  # C được chọn theo AUC trên Validation
  C_grid: [0.001, 0.01, 0.1]
  max_iter: 3000
  clip_quantiles: [0.01, 0.99]
  onehot_min_frequency: 0.005

lightgbm:
  params:
    objective: binary
    learning_rate: 0.02
    num_leaves: 34
    max_depth: 8
    min_child_samples: 80
    subsample: 0.87
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_alpha: 0.04
    reg_lambda: 0.07
    min_split_gain: 0.02
    n_estimators: 10000
    n_jobs: -1
    verbose: -1
  early_stopping_rounds: 200

hetero_gnn:
  hidden: 64
  num_layers: 2
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 1024
  max_epochs: 30
  # Dừng sớm khi AUC trên Validation không cải thiện sau ngần này epoch
  patience: 4
  num_threads: 16
